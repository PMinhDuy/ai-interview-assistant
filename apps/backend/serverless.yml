service: ai-interview-backend
frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'ap-southeast-1'}
  
  # IAM permissions for Lambda function
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${self:custom.s3BucketName}/*"
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource: "arn:aws:s3:::${self:custom.s3BucketName}"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

  # CRITICAL: AWS Lambda FORBIDS any custom environment variable key starting with AWS_
  # (e.g. AWS_REGION, AWS_S3_BUCKET, AWS_ACCESS_KEY_ID).
  # Use S3_BUCKET_NAME instead.
  environment:
    NODE_ENV: production
    DATABASE_URL: ${env:DATABASE_URL}
    DIRECT_URL: ${env:DIRECT_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_REFRESH_SECRET: ${env:JWT_REFRESH_SECRET}
    JWT_ACCESS_EXPIRES_IN: "15m"
    JWT_REFRESH_EXPIRES_IN: "7d"
    AI_PROVIDER: gemini
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
    STORAGE_PROVIDER: s3
    S3_BUCKET_NAME: ${self:custom.s3BucketName}
    CORS_ORIGINS: ${env:CORS_ORIGINS, 'https://ai-interview-assistant.pages.dev'}

custom:
  s3BucketName: ai-interview-assistant-uploads-${self:provider.stage}

functions:
  api:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src/lambda.handler
    memorySize: 512
    timeout: 29
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

resources:
  Resources:
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3BucketName}
        CorsConfiguration:
          CorsRules:
            - AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
                - HEAD
              AllowedOrigins:
                - "https://ai-interview-assistant.pages.dev"
                - "http://localhost:3001"
              AllowedHeaders:
                - "*"
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
