name: 🌐 Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/types/**'

  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Cloudflare Pages)
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: pnpm --filter @repo/frontend build

      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/frontend
          npx wrangler pages deploy .next \
            --project-name=ai-interview-assistant \
            --branch=production \
            --commit-message="Deploy ${{ github.sha }}"

      - name: Notify deployment success
        run: |
          echo "## ✅ Frontend Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://ai-interview-assistant.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
